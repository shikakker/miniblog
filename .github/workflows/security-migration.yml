name: Security migration

on:
  push:
    branches: [ai/product-completion/miniblog]
    paths:
      - .github/workflows/security-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/product-completion/miniblog
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile --non-interactive
      - name: Upgrade patched public runtime
        run: |
          yarn add --exact next@15.5.24 react@18.2.0 react-dom@18.2.0
          yarn add --dev --exact eslint@8.57.1 eslint-config-next@15.5.24
          node <<'NODE'
          const fs = require('fs')
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          pkg.engines = { node: '22.x' }
          pkg.packageManager = 'yarn@1.22.22'
          pkg.resolutions = {
            ...(pkg.resolutions || {}),
            eventsource: '1.1.2',
            'next/postcss': '8.5.23',
            'next/postcss/nanoid': '3.3.18'
          }
          pkg.scripts = {
            ...pkg.scripts,
            lint: 'eslint . --ext .js,.jsx --max-warnings=0'
          }
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n')
          NODE
          yarn install --non-interactive
      - run: node --test tests/*.test.mjs
      - run: yarn audit --groups dependencies --level high
      - run: yarn lint
      - name: Build public web app without external CMS access
        run: SANITY_OFFLINE_BUILD=true yarn build
      - name: Commit verified dependency state
        run: |
          git config user.name 'Egor Denisov'
          git config user.email 'designer.egor@ya.ru'
          git add package.json yarn.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix: upgrade miniblog public runtime security boundary'
          git push origin HEAD:ai/product-completion/miniblog
