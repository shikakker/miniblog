name: Quality

on:
  push:
    branches: [ai/product-completion/miniblog]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: node --test tests/*.test.mjs
      - run: yarn install --frozen-lockfile --non-interactive
      - name: Audit production dependencies (block high/critical)
        run: |
          yarn audit --groups dependencies --json > audit.json || true
          node <<'NODE'
          const fs = require('fs')
          const lines = fs.readFileSync('audit.json', 'utf8').trim().split('\n').filter(Boolean)
          const entries = lines.map(line => JSON.parse(line))
          const summary = entries.find(entry => entry.type === 'auditSummary')
          if (!summary) throw new Error('Yarn audit did not produce an auditSummary')
          const v = summary.data.vulnerabilities || {}
          console.log(`production audit: low=${v.low || 0} moderate=${v.moderate || 0} high=${v.high || 0} critical=${v.critical || 0}`)
          if ((v.high || 0) > 0 || (v.critical || 0) > 0) process.exit(1)
          NODE
      - run: yarn lint
      - name: Build public web app without external CMS access
        env:
          SANITY_OFFLINE_BUILD: 'true'
        run: yarn build
